# Workflows pin every action to a commit SHA, so a moved tag cannot change what
# runs with release permissions. Dependabot keeps those pins current: it opens a
# PR with the new SHA and the version in the trailing comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
