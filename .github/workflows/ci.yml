# The quality gate for the JS monorepo: the SDK and its two adapters. Nothing here calls the
# API, and nothing here needs a credential: the live suites need the services behind the API,
# so sproutsdata-py's e2e.yml runs them nightly against its local stack (it checks this
# repository out), and scripts/smoke-live.mjs runs by hand.
#
# release.yml runs this same workflow (`workflow_call`) before it publishes anything. Every
# action is pinned to a commit SHA; dependabot keeps the pins current.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # Everything that does not depend on the Node.js version, once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # First: the adapters and the examples import `sproutsdata` as a consumer does, from its
      # built declarations, so typed lint needs the build.
      - run: npm run build
      - run: npm run lint
      - run: npm run lint:layers
      - name: Vendored spec and generated code are current
        run: npm run check:generated
      - run: npm run typecheck
      - name: Every code block in the docs compiles
        run: npm run check:docs
      - run: npm run check:links
      - name: Package shape (publint, are-the-types-wrong)
        run: npm run check:package
      - name: The declarations in a strict and a lenient consumer, skipLibCheck off
        run: npm run check:consumer
      - run: npm run check:size
      - name: What npm publish would upload
        run: |
          for ws in packages/sdk packages/langchain packages/ai-sdk; do
            npm pack --dry-run -w "$ws"
          done
      - name: Nothing in the repository or the packages names a service behind the API
        # The denied words come from their secret; a pull request from a fork has none, and is
        # checked for the patterns only (release.yml requires the words).
        env:
          SPROUTSDATA_DENIED_WORDS: ${{ secrets.SPROUTSDATA_DENIED_WORDS }}
        run: npm run check:public-text
      - run: npm run audit

  test:
    # The suites with coverage, then the built package loaded through both of its formats, on
    # the Node.js floor (22.12.0) and on current releases.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.12.0", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run smoke:dist

  edge:
    # The built SDK inside workerd (the Cloudflare Workers runtime): one call per resource.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke:edge
